name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://www.redtailtelematics.com
      NEXT_PUBLIC_SANITY_API_VERSION: "2026-04-01"
      NEXT_PUBLIC_SANITY_PROJECT_ID: bulruaoh
      NEXT_PUBLIC_SANITY_DATASET: production
      # Never send CI browser traffic to the live analytics container.
      NEXT_PUBLIC_GTM_ID: GTM-TEST0000

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks and unit tests
        run: npm run check

      - name: Build production application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end browser checks
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit the complete dependency tree
        run: npm audit
