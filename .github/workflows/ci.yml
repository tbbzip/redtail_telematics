name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://www.redtailtelematics.com
      NEXT_PUBLIC_SANITY_API_VERSION: "2026-04-01"
      NEXT_PUBLIC_SANITY_PROJECT_ID: bulruaoh
      NEXT_PUBLIC_SANITY_DATASET: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks and unit tests
        run: npm run check

      - name: Build production application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end browser checks
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit the complete dependency tree
        run: npm audit
